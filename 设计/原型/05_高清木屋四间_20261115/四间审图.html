<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>风雪之外｜四间高清插画审图</title><style>body{background:#15212c;color:#eee4d3;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;margin:0}.main{max-width:1420px;padding:24px;margin:0 auto}h1{font-size:25px}p{color:#c6ced1;line-height:1.55}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}button,select{padding:11px 15px;background:#304654;border:1px solid #60798a;border-radius:8px;color:#f1e7d8}button.active{background:#80644a}.stage{background:#23323e;overflow:auto;border:1px solid #405562;padding:14px}.stage img{display:block;margin:auto;width:1280px;height:720px;object-fit:contain;max-width:none;box-shadow:0 6px 22px #0e151b}.warn{padding:12px;border-left:3px solid #ae9e80;background:#263440}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:25px 0}.grid img{width:100%;aspect-ratio:16/9;object-fit:cover}.grid span{display:block;margin:7px 0}@media(max-width:700px){.grid{grid-template-columns:1fr}}small{color:#9aafbc}</style></head><body><div class="main"><h1>《风雪之外》· 四间高清插画视觉审图</h1><p>高清画风参考、不是 G5 可分层正式开局背景。四间都保留大雪窗；切换只改变正在预览的房间。</p><div class="buttons" id="tabs"></div><label>实际窗口尺寸 <select id="width"><option value="320">320×180</option><option value="480">480×270</option><option value="1280" selected>1280×720</option></select></label><div class="stage" id="stage"><img id="current" alt="选中房间的高清插画"></div><p id="info"></p><p class="warn">原始生成尺寸约为 1672×941；2560×1440 WebP 属于展示导出。画面中部分角色、灯和物件已烘焙，玻璃未挖透明孔；需要经过真实 G5 中性板重绘才可作为游戏状态资产。</p><div class="grid"><div><img src="炉间_高清展示_2560x1440.webp" alt="炉间"><span>炉间</span></div><div><img src="观测间_高清展示_2560x1440.webp" alt="观测间"><span>观测间</span></div><div><img src="灶间_高清展示_2560x1440.webp" alt="灶间"><span>灶间</span></div><div><img src="卧室_高清展示_2560x1440.webp" alt="卧室"><span>卧室</span></div></div><small>2026-11-15 · 设计审图 / 04–05 交接</small></div><script>const rooms=[{"name":"炉间","file":"炉间_高清展示_2560x1440.webp","desc":"唯一起居柴炉（炉膛未燃）、大窗雪林、扶手椅、收音机与唱片机"},{"name":"观测间","file":"观测间_高清展示_2560x1440.webp","desc":"全屋最大的雪窗、气象仪器、望远镜与记录工作台"},{"name":"灶间","file":"灶间_高清展示_2560x1440.webp","desc":"宽雪景窗、料理台、食材储物架和站姿做饭角色"},{"name":"卧室","file":"卧室_高清展示_2560x1440.webp","desc":"宽雪窗、完整床、床头柜、夜间雪光与人物休息姿态"}],tabs=document.getElementById("tabs"),wd=document.getElementById("width"),current=document.getElementById("current");let i=1;rooms.forEach((r,n)=>{const b=document.createElement("button");b.textContent=(n+1)+" "+r.name;b.onclick=()=>{i=n;update()};tabs.appendChild(b)});function update(){const r=rooms[i],w=Number(wd.value);current.src=r.file;current.alt=r.name;current.style.width=w+"px";current.style.height=(w*9/16)+"px";document.getElementById("info").textContent=r.name+"： "+r.desc;[...tabs.children].forEach((b,n)=>b.classList.toggle("active",n===i));}document.addEventListener("keydown",e=>{if(e.target.tagName==="SELECT")return;const n=Number(e.key);if(n>0&&n<=4){i=n-1;update()}});wd.onchange=update;update();</script></body></html>

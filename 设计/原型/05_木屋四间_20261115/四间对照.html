<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>风雪之外｜四间大窗构图</title><style>body{margin:0;background:#172633;color:#efe7d5;font:16px system-ui,"PingFang SC",sans-serif}main{max-width:1380px;margin:auto;padding:24px}h1{font-size:24px;font-weight:600}p{color:#b7c6c9;line-height:1.65}.toolbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:22px 0}button,select{background:#344b58;border:1px solid #637483;color:#f4ecdb;border-radius:8px;padding:9px 12px;cursor:pointer}button[aria-pressed="true"]{background:#80644a}#stage{max-width:100%;overflow:auto;background:#28353b;border:1px solid #53616a;border-radius:10px;padding:14px}.screen{margin:auto;max-width:none;position:relative;overflow:hidden;box-shadow:0 3px 26px #111a25}.screen img{display:block;width:100%;height:100%;object-fit:fill}small{color:#b2c6c5}.rooms{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><main><h1>风雪之外 · 四间木屋 / 大窗版结构候选</h1><p>每间整幅 16:9；只切玩家选择的房间，不跟人。此页只是静态构图与站位的视觉检查，尚非游戏与 G5 高清手绘。窗外蓝色雪景仅为预览层；正式窗玻璃需透明。</p><div class="toolbar"><div id="roomBtns" class="rooms"></div><label>视图 <select id="pose"><option value="empty">空屋</option><option value="posed">男性动作试摆</option></select></label><label>尺寸 <select id="size"><option value="320">320 × 180</option><option value="480">480 × 270</option><option value="1280" selected>1280 × 720</option></select></label><a href="房间平面示意.svg" style="color:#b7d3e7">查看平面图</a></div><div id="stage"><div id="screen" class="screen"><img id="scene" alt="四间木屋候选"></div></div><p id="caption"></p><small>候选版本 2026-11-15；站位见同目录 JSON。前往下一阶段前须用户审图与 Claude 按 03/06 复核。</small></main><script>
const data=[["炉间","炉间_空屋.svg","炉间_读书.svg","扶手椅读书"],["观测间","观测间_空屋.svg","观测间_写字.svg","书桌写字"],["灶间","灶间_空屋.svg","灶间_料理.svg","料理台干活"],["卧室","卧室_空屋.svg","卧室_睡觉.svg","床上睡觉"]];
let selected=1;const buttons=document.getElementById("roomBtns"),pose=document.getElementById("pose"),size=document.getElementById("size");
data.forEach((r,i)=>{let b=document.createElement("button");b.textContent=(i+1)+". "+r[0];b.onclick=()=>{selected=i;update()};buttons.appendChild(b)});
function update(){const r=data[selected],w=Number(size.value);document.getElementById("scene").src=pose.value==="empty"?r[1]:r[2];document.getElementById("screen").style.width=w+"px";document.getElementById("screen").style.height=(w*9/16)+"px";document.getElementById("caption").textContent=r[0]+" / "+(pose.value==="empty"?"空屋":"男性 "+r[3])+" / "+w+" × "+w*9/16;[...buttons.children].forEach((b,i)=>b.setAttribute("aria-pressed",String(i===selected)))}
pose.addEventListener("change",update);size.addEventListener("change",update);document.addEventListener("keydown",e=>{if(e.target instanceof HTMLInputElement||e.target instanceof HTMLSelectElement)return;const n=Number(e.key);if(n>=1&&n<=4){selected=n-1;update()}});update();
</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>风雪之外｜四间木屋分层底图验收</title><style>
:root{color-scheme:dark}body{background:#14212d;color:#ecdfc8;margin:0;font:15px system-ui,"PingFang SC",sans-serif}main{max-width:1360px;margin:auto;padding:20px}p{line-height:1.65;color:#abbfce}label{display:inline-flex;align-items:center;gap:6px}select,button{border-radius:7px;background:#344c5b;color:#f9ebd2;border:1px solid #647585;padding:8px 10px}button{cursor:pointer}button[aria-pressed="true"]{background:#766149}nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}#wrap{background:#1c2a37;overflow:auto;padding:12px;border:1px solid #44576a;border-radius:12px}#scene{position:relative;overflow:hidden;max-width:none;margin:auto;box-shadow:0 5px 22px #050e16}#scene>img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}img[src=""]{display:none}.sub{font-size:12px;opacity:.77}</style></head>
<body><main><h1>风雪之外 · 四间木屋分层底图</h1><p>这是从实际 RGBA 图层合成的浏览器预览：外景单独渲染在下层，室内木屋的玻璃部分有透明像素；切换房间与冬昼/冬夜不会修改角色行为。此版本为 <strong>可集成的预生产资产</strong>，但尚未通过严格原生 G5 验收。</p><nav><span id="room"></span><label>场景尺寸 <select id="size"><option value="320">320×180</option><option value="480">480×270</option><option value="1280" selected>1280×720</option><option value="2560">2560×1440</option></select></label><label>时间 <select id="day"><option value="day">冬昼</option><option value="night">冬夜</option></select></label><label>显示 <select id="mode"><option value="composite">分层合成</option><option value="interior">仅透明室内层</option><option value="exterior">仅窗外层</option></select></label></nav><div id="wrap"><div id="scene"><img id="exterior" alt="独立窗外景"><img id="interior" alt="玻璃透明的室内底图"><img id="ambient" alt="冬夜色蒙版"></div></div><p class="sub" id="info"></p><p class="sub">生产限制：源画为 1672×941，2560×1440 为高质量重采样；图层玻璃遮罩是初级颜色抠像、部分可变陈设依然烘焙。正式原生 G5 仍需补画状态层/灯火与精准遮罩。参见 manifest.json。</p></main><script>
const rooms=[['hearth_room','炉间'],['observation_room','观测间'],['kitchen_room','灶间'],['bedroom','卧室']];let current='observation_room';const $=id=>document.getElementById(id);for(let [k,n] of rooms){let b=document.createElement('button');b.textContent=n;b.dataset.room=k;b.onclick=()=>{current=k;draw()};$('room').appendChild(b)}
function draw(){let width=Number($('size').value),mode=$('mode').value,night=$('day').value==='night',base='./'+current+'/';$('scene').style.width=width+'px';$('scene').style.height=Math.round(width*9/16)+'px';$('exterior').src=base+(night?'outside_winter_night_rgba.webp':'outside_winter_day_rgba.webp');$('interior').src=base+'interior_rgba.webp';$('ambient').src=base+'night_ambient.webp';$('exterior').style.display=(mode==='interior')?'none':'block';$('interior').style.display=(mode==='exterior')?'none':'block';$('ambient').style.display=(night&&mode==='composite')?'block':'none';document.querySelectorAll('button[data-room]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.room===current)));$('info').textContent='当前场景: '+rooms.find(r=>r[0]===current)[1]+' ｜ '+width+'×'+Math.round(width*9/16)+' ｜ '+(night?'冬夜':'冬昼')+' ｜ '+mode}
for(let id of ['size','day','mode'])$(id).addEventListener('change',draw);document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;const n=Number(e.key);if(n>=1&&n<=4){current=rooms[n-1][0];draw()}});draw();
</script></body></html>

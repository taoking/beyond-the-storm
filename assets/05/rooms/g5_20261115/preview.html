<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"><title>风雪之外 · 四间分层美术复核</title><style>body{margin:0;background:#152532;color:#e8e0cf;font:15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1400px;margin:auto;padding:18px}h1{font-size:24px}p{line-height:1.65;color:#b6c7d2}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0;align-items:center}.controls label{display:flex;gap:6px;align-items:center;background:#283b48;padding:7px 10px;border-radius:6px}.controls select{background:#1a3445;color:#f7edda;border:1px solid #678093;border-radius:5px;padding:6px}#viewport{overflow:auto;background:#263841;padding:12px;border:1px solid #667c80;border-radius:9px}#scene{position:relative;margin:auto;background:#152331;overflow:hidden;box-shadow:0 4px 16px #121e28}#scene img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:fill;image-rendering:auto}small{color:#a0c1ce}button{background:#3e5a70;color:white;border:0;border-radius:8px;padding:8px;cursor:pointer}</style></head><body><main><h1>风雪之外 · 四间大窗 / 第二轮复核</h1><p>手动选择房间，不自动追人；可切换实物分层与天气。此页为离线设计审图页，不连接游戏状态。底图是 2560×1440 重采样版（非原生 G5）。</p><div class="controls"><label>房间<select id="room"><option value="observation_room">观测间</option><option value="hearth_room">炉间</option><option value="kitchen_room">灶间</option><option value="bedroom">卧室</option></select></label><label>昼夜<select id="time"><option value="day">冬昼</option><option value="night">冬夜</option></select></label><label>天气<select id="weather"><option value="calm" selected>平静</option><option value="snow">下雪</option><option value="blizzard">暴风雪</option></select></label><label>炉火<select id="fire"><option value="out">无</option><option value="ember">余烬</option><option value="low">小火</option><option value="high">旺火</option></select></label><label>尺寸<select id="size"><option value="320">320×180</option><option value="480">480×270</option><option value="1280" selected>1280×720</option></select></label><label><input type="checkbox" id="actor">男主角</label><label><input type="checkbox" id="props">可变物品</label><label><input type="checkbox" id="lamp">油灯</label><label><input type="checkbox" id="heater">观测间暖炉点燃</label><label><input type="checkbox" id="shade" checked>人物遮挡</label><button id="refresh">刷新预览</button></div><div id="viewport"><div id="scene"></div></div><p id="desc"></p><p><small>冬夜为局部暖/冷照明蒙版，不是纯蓝叠图；窗外雪势来自同一气象事件；此轮平静天气已进行小雪点修整，原画仍可能留有较大的雪痕；正式晴天需人工精修。</small></p><script>
const rooms={hearth_room:'炉间',observation_room:'观测间',kitchen_room:'灶间',bedroom:'卧室'},R=id=>document.getElementById(id);const roomprops={hearth_room:['woodpile_3.webp','armchair_blanket.webp'],observation_room:['books_few.webp','cup.webp','map.webp'],kitchen_room:['stock_sparse.webp','herbs.webp','coat.webp'],bedroom:['quilt_thick.webp']};
function render(){const room=R('room').value,night=R('time').value==='night',fire=R('fire').value,weather=R('weather').value,actor=R('actor').checked,props=R('props').checked,lamp=R('lamp').checked,w=+R('size').value,prefix=room+'/';const layers=[];const add=(f)=>layers.push(prefix+f);
add(night?'outside_winter_night_rgba.webp':'outside_winter_day_rgba.webp');add('interior_rgba.webp');if(weather!=='calm')add('weather_'+weather+'.webp');if(props){for(const p of roomprops[room]){if(room==='bedroom'&&p==='quilt_thick.webp')continue;add(p)}}if(actor){add('actor_contact.webp');add('actor_male_pose.webp');if(room==='bedroom'&&R('shade').checked)add('bed_front_occlusion.webp');if(room==='observation_room'&&R('shade').checked)add('chair_front_occlusion.webp')}if(props&&room==='bedroom')add('quilt_thick.webp');if(night)add('night_ambient.webp');if(fire!=='out'){add('fire_spill_'+(fire==='high'?'high':'low')+'.webp');if(room==='hearth_room')add('fire_flame_'+fire+'.webp')}add('oil_lamp_body.webp');if(lamp)add('oil_lamp_glow.webp');if(room==='observation_room'&&R('heater').checked)add('heater_flame_on.webp');const scene=R('scene');scene.style.width=w+'px';scene.style.height=(w*9/16)+'px';scene.replaceChildren(...layers.map(src=>{const i=document.createElement('img');i.src=src;i.alt='';return i}));R('desc').textContent=rooms[room]+' / '+(night?'冬夜':'冬昼')+' / '+weather+' / '+w+'×'+(w*9/16)+' / '+layers.length+' 层';}
for(const id of ['room','time','weather','fire','size','actor','props','lamp','shade','heater'])R(id).addEventListener('change',render);R('refresh').addEventListener('click',render);document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;const rooms=['hearth_room','observation_room','kitchen_room','bedroom'];let n=Number(e.key);if(n>=1&&n<=4){R('room').value=rooms[n-1];render()}});render();
</script></main></body></html>

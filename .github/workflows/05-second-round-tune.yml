name: 05 second-round image visual correction
on:
  push:
    branches:
      - gpt/05-four-room-second-round-20261115
    paths:
      - "assets/05/rooms/g5_20261115/second_round_tune.py"
      - ".github/workflows/05-second-round-tune.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  frame-guard-and-visual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pillow>=11,<13" "numpy>=2,<3"
      - name: Recheck magenta leaks and unlit heater
        run: python assets/05/rooms/g5_20261115/second_round_tune.py
      - name: Confirm integrity of full four-room scene
        run: python assets/05/rooms/g5_20261115/validate.py
      - name: Commit asset fixes and visual evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/05/rooms/g5_20261115 '设计/讨论记录/2026-11-15_四间第二轮执行图'
          git diff --cached --quiet && exit 0
          git commit -m "art(05): refine window apertures and unlit kerosene heater"
          git push origin HEAD:gpt/05-four-room-second-round-20261115
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 05-second-round-corrected-magentas
          path: 设计/讨论记录/2026-11-15_四间第二轮执行图/
          retention-days: 14
          if-no-files-found: warn

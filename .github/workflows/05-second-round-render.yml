name: 05 second-round four-room art render

on:
  push:
    branches:
      - gpt/05-four-room-second-round-20261115
    paths:
      - "assets/05/rooms/g5_20261115/second_round.py"
      - "assets/05/rooms/g5_20261115/preview.html"
      - "assets/05/rooms/g5_20261115/validate.py"
      - ".github/workflows/05-second-round-render.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout second-round branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer dependencies
        run: pip install "pillow>=11,<13" "numpy>=2,<3"
      - name: Patch painted assets and generate full visual proof
        run: python assets/05/rooms/g5_20261115/second_round.py
      - name: Validate geometry, sizes, checksums and occlusion
        run: python assets/05/rooms/g5_20261115/validate.py
      - name: Commit updated binaries and QA pictures into this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/05/rooms/g5_20261115 \
            '设计/讨论记录/2026-11-15_四间第二轮执行图'
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "art(05): rebuild four rooms, layered props and visual proof"
            git push origin HEAD:gpt/05-four-room-second-round-20261115
          fi
      - name: Upload proofs for CI inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 05-four-room-second-round-qa
          path: |
            设计/讨论记录/2026-11-15_四间第二轮执行图/*.jpg
            设计/讨论记录/2026-11-15_四间第二轮执行图/*.png
          if-no-files-found: warn
          retention-days: 14

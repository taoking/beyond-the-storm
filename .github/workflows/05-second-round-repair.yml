name: 05 second-round final QA-repaired asset render
on:
  push:
    branches:
      - gpt/05-four-room-second-round-20261115
    paths:
      - "assets/05/rooms/g5_20261115/second_round_repair.py"
      - ".github/workflows/05-second-round-repair.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pillow>=11,<13" "numpy>=2,<3" "opencv-python-headless>=4.10,<5"
      - name: Restore strict frame scope and repair sleeping pose
        run: python assets/05/rooms/g5_20261115/second_round_repair.py
      - name: Validate layer sizes, hashes, coordinate and mask safety
        run: python assets/05/rooms/g5_20261115/validate.py
      - name: Commit corrected assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/05/rooms/g5_20261115 '设计/讨论记录/2026-11-15_四间第二轮执行图'
          git diff --cached --quiet && exit 0
          git commit -m "art(05): final conservative window fixes and sleep occlusion"
          git push origin HEAD:gpt/05-four-room-second-round-20261115
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 05-conservative-final-panes-and-actor
          path: 设计/讨论记录/2026-11-15_四间第二轮执行图/
          if-no-files-found: warn
          retention-days: 14

name: 06 v0.4 pine forest slice

on:
  push:
    branches:
      - gpt/06-v0.4-forest-slice-20261114
    paths:
      - "game/**"
      - ".github/workflows/06-v04-forest.yml"
      - "设计/原型/05_v1.0_G2只读视觉适配器*"
      - "设计/原型/05_v1.0_06真实快照冒烟.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forest-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: game/package-lock.json
      - name: Install unchanged 06 dependencies
        working-directory: game
        run: npm ci
      - name: All 06 world, focus, visual and pine-forest tests
        working-directory: game
        run: npm test
      - name: TypeScript check and production bundle
        working-directory: game
        run: npm run build
      - name: 05 readonly art-state contract
        run: node "设计/原型/05_v1.0_G2只读视觉适配器.test.cjs"
      - name: 1440-minute real core -> 4320 visual frames
        run: node --experimental-strip-types "设计/原型/05_v1.0_06真实快照冒烟.mjs"

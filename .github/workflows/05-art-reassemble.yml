name: "05 | Assemble verified G1-G2 artwork"

on:
  push:
    branches:
      - gpt/05-g1-g2-assets-upload-20261114
    paths:
      - .github/workflows/05-art-reassemble.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble-artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout art upload branch
        uses: actions/checkout@v4
        with:
          ref: gpt/05-g1-g2-assets-upload-20261114
          persist-credentials: true

      - name: Rebuild ZIP, check SHA-256 and CRC before extracting
        run: |
          python3 deliverables/05/g1-g2-20261114/rebuild_archive.py --extract

      - name: Assemble and verify the original G2 room background PNG
        run: |
          python3 - <<'PY'
          import json, hashlib, pathlib
          root=pathlib.Path("deliverables/05/g1-g2-20261114")
          manifest=json.loads((root/"scene-manifest.json").read_text())
          data=bytearray()
          for part in manifest["parts"]:
              p=root/part["file"]
              b=p.read_bytes()
              assert len(b)==part["size"], str(p)
              h=hashlib.sha1(f"blob {len(b)}\0".encode()+b).hexdigest()
              assert h==part["gitBlobSha1"], str(p)
              data.extend(b)
          actual=hashlib.sha256(data).hexdigest()
          assert len(data)==manifest["expected_bytes"] and actual==manifest["expected_sha256"], (len(data),actual)
          target=pathlib.Path(manifest["target"])
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(data)
          print("Verified G2", target, actual)
          PY

      - name: Extract full-size scene compositions without modifying images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil
          root=Path("deliverables/05/g1-g2-20261114")
          extracted=root/"extracted"
          target=root/"full-scenes"
          target.mkdir(parents=True,exist_ok=True)
          variants=["male","female"]
          poses=["sleep","sitRead","sitWrite","standWork"]
          for variant in variants:
              for pose in poses:
                  src=extracted/"previews"/f"{variant}_{pose}.png"
                  dst=target/f"{variant}_{pose}.png"
                  assert src.exists(),f"Missing full-size composition {src}"
                  shutil.copyfile(src,dst)
                  assert src.read_bytes()==dst.read_bytes()
                  layer=Path("assets/05/actor/indoor")/variant/f"{pose}.png"
                  source_layer=extracted/layer
                  assert source_layer.exists() and layer.exists(),f"Missing layer {layer}"
                  assert source_layer.read_bytes()==layer.read_bytes(),f"Git layer mismatch {layer}"
          for relative in ("README.md","manifest.json","qa/qa.json"):
              src=extracted/relative; dst=root/relative
              if src.exists():
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(src,dst)
          shutil.rmtree(extracted)
          print("Full-size compositions verified:",len(variants)*len(poses))
          PY

      - name: Remove transmission fragments after complete source verification
        run: |
          rm -rf deliverables/05/g1-g2-20261114/archive-parts
          rm -rf deliverables/05/g1-g2-20261114/scene-parts
          echo "ZIP + source PNG + eight RGBA layers + eight full scenes are now ready."

      - name: Commit exact original ZIP and PNGs back to art branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/05 deliverables/05/g1-g2-20261114
          if git diff --cached --quiet; then
            echo "No new art changes to commit"
            exit 0
          fi
          git commit -m "assets(05): publish checksum-verified original ZIP and 8 full cabin composites"
          git push origin HEAD:gpt/05-g1-g2-assets-upload-20261114
